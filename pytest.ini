[pytest]
pythonpath = src
addopts = -ra --strict-markers --alluredir=allure-results --clean-alluredir
markers =
    smoke: smoke tests covering core user journey
    regression: broader regression tests
    e2e: end-to-end browser automation scenarios
    handles_login: scenario performs its own login instead of using automatic login
    test_user_logs_in_with_valid_credentials: login scenario identifier for the Gherkin runner
    test_Create_a_new_admin_user: admin user lifecycle scenario identifier for the Gherkin runner
testpaths = tests
bdd_features_base_dir = tests/features

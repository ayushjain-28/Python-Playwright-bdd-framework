[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-python-bdd"
version = "0.1.0"
description = "Playwright Python BDD framework"
requires-python = ">=3.12,<3.14"
dependencies = [
  "playwright>=1.48,<2",
  "pytest>=8,<9",
  "pytest-bdd>=7,<9",
  "allure-pytest>=2.13,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"